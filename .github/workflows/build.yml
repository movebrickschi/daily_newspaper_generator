name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Concurrency: 同分支后续推送会取消前一次未完成的运行，节省 Actions minutes。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile & Test
        run: ./gradlew --no-daemon build

      - name: Verify Plugin (jetbrains/intellij verifier)
        # 仅在 push 到 main / master / develop 或 release 时跑 verifier；PR 跳过节省时间。
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: ./gradlew --no-daemon verifyPlugin
        continue-on-error: true

      - name: Build distributable zip
        run: ./gradlew --no-daemon buildPlugin

      - name: Upload plugin artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: warn
          retention-days: 14
